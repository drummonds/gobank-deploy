version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  fmt:
    desc: Format Go source files
    cmds:
      - go fmt ./...
      - go fix ./...

  vet:
    desc: Run Go vet
    cmds:
      - go vet ./...

  test:
    desc: Run tests
    cmds:
      - go test ./...

  check:
    desc: Run fmt, vet, test
    cmds:
      - task: fmt
      - task: vet
      - task: test

  deps:tidy:
    desc: Tidy Go modules
    cmds:
      - go mod tidy

  install:
    desc: Install gobank-deploy into GOPATH/bin
    cmds:
      - go install -ldflags "-X main.version=$(git describe --tags --always)" ./cmd/gobank-deploy

  up:
    desc: "Deploy to an environment (task up ENV=preprod CREATE=1 SCALE=small); run via tp secrets"
    cmds:
      - go run ./cmd/gobank-deploy -src {{.SRC | default "../gobank"}} up {{.ENV | default "preprod"}} {{if .CREATE}}-create{{end}} -scale {{.SCALE | default "small"}}

  down:
    desc: Delete an environment's server — this is what stops billing (task down ENV=preprod); run via tp secrets
    cmds:
      - go run ./cmd/gobank-deploy down {{.ENV | default "preprod"}} {{.CLI_ARGS}}

  status:
    desc: Show an environment's server state and URL (task status ENV=preprod); run via tp secrets
    cmds:
      - go run ./cmd/gobank-deploy status {{.ENV | default "preprod"}}

  ui:
    desc: "Web page with each environment's state and create/redeploy/down controls (task ui ENVS=prod,preprod,demo); run via tp secrets"
    cmds:
      - go run ./cmd/gobank-deploy -src {{.SRC | default "../gobank"}} ui -addr {{.ADDR | default ":1348"}} -envs {{.ENVS | default "prod,preprod,demo"}}

  build:
    desc: Build cmd/demo for linux amd64+arm64 into build/releases (no token needed)
    cmds:
      - go run ./cmd/gobank-deploy -src {{.SRC | default "../gobank"}} build

  push:
    desc: Build, then copy the latest release into hydrogen's store at /perm/gobank-deploy/releases over breakglass
    deps: [build]
    vars:
      GOK_PARENT: '{{.HOME}}/minor/gok_local'
      SSH: ssh -o BatchMode=yes -o ProxyCommand="{{.HOME}}/go/bin/breakglass -parent_dir {{.GOK_PARENT}} -proxy hydrogen"
      DST: /perm/gobank-deploy/releases
    cmds:
      - |
        VER=$(cat build/releases/latest)
        {{.SSH}} hydrogen "mkdir -p {{.DST}}"
        tar -C build/releases -cf - "$VER" latest | {{.SSH}} hydrogen "tar -xf - -C {{.DST}}"
        {{.SSH}} hydrogen "echo latest: \$(cat {{.DST}}/latest); ls -l {{.DST}}/$VER"

  clean:
    desc: Remove build output
    cmds:
      - rm -rf build
